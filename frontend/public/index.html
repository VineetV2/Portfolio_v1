  <!-- Preloader styles (inline for instant render) -->
  <style>
    #preloader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: #030712;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #preloader.hidden {
      opacity: 0;
      visibility: hidden;
    }
    .loader-name {
      font-family: 'Syne', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      color: #F8FAFC;
      letter-spacing: -0.02em;
      margin-bottom: 2rem;
      opacity: 0;
      animation: fadeSlideUp 0.8s 0.2s forwards;
    }
    .loader-name span { color: #0EF6CC; }
    .loader-bar-container {
      width: 200px;
      height: 2px;
      background: rgba(255,255,255,0.06);
      border-radius: 1px;
      overflow: hidden;
    }
    .loader-bar {
      height: 100%;
      width: 0;
      background: #0EF6CC;
      border-radius: 1px;
      animation: loadProgress 1.8s 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .loader-percent {
      font-family: 'Fira Code', monospace;
      font-size: 0.75rem;
      color: rgba(148,163,184,0.5);
      margin-top: 1rem;
      letter-spacing: 0.1em;
      opacity: 0;
      animation: fadeSlideUp 0.6s 0.6s forwards;
    }
    @keyframes loadProgress {
      0% { width: 0; }
      40% { width: 60%; }
      80% { width: 90%; }
      100% { width: 100%; }
    }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <!-- Preloader -->
  <div id="preloader">
    <div class="loader-name">vineet<span>.</span>vora</div>
    <div class="loader-bar-container">
      <div class="loader-bar"></div>
    </div>
    <div class="loader-percent">loading</div>
  </div>

  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>

  <script>
    window.addEventListener('load', function() {
      setTimeout(function() {
        var preloader = document.getElementById('preloader');
        if (preloader) {
          preloader.classList.add('hidden');
          setTimeout(function() { preloader.remove(); }, 600);
        }
      }, 2200);
    });
  </script>
</body>
